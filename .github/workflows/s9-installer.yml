# The Galaxy S9's TWRP installer, built from nothing in one job (Actions > s9-installer > Run workflow).
#
# The job:
#   1. downloads iOS 16.5 (20F66) for iPhone10,3 from Apple's CDN, checked by size and hash;
#   2. unpacks it (sysimage/unpack.sh) and builds the loader's iPhone identity (xnuloader/mkidentity.sh);
#   3. builds the S9 kernel, the loader, Mesa, the small root (ALONE=1 RC=rc.launchd) and the system image;
#   4. makes the installer (Scion-Project/scion-installer universal/mkinstaller.sh): Scion's boot image to BOOT,
#      the system image to the partition given (SYSTEM), and a formatted USERDATA: /private/var becomes
#      persistent there (and Android's data in USERDATA is erased).
#
# The image carries the Procursus prefix with Sileo; with tweaks on (the default) ElleKit and PreferenceLoader,
# and ipainstaller at /var/jb/usr/bin/ipainstaller (docs/IPA.md).
#
# The installer carries iOS's own files. This repository is public, and any signed-in GitHub user can download
# a public repository's artifacts. So the job uploads one 7z archive, AES-256 with its file names encrypted, with
# the passphrase of the repository secret INSTALLER_PASSPHRASE. Without the secret the job stops before it
# builds anything. Inside the archive: the installer zip exactly as TWRP flashes it, its SHA256SUMS and a README.
# Before uploading, the job decrypts its own archive and checks the zip. Artifacts are kept for 3 days.
name: s9-installer

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Scion-Project/scion-kernel branch, tag or commit
        default: main
      packaging_ref:
        description: Scion-Project/scion-installer branch, tag or commit
        default: main
      partition:
        description: The partition the iOS system image is written to
        default: SYSTEM
      boot_args:
        description: "Extra boot-arguments (for example mali=9, or max77705_wdt=1 max77705_diag=1 max77705_fg_s=30 tmu=3 fps_log=1; for screen-on heat add gov_policy=2 cpufreq_gov_big_max=1469000 mali_gov_frame=455; gov_policy=3 can be hotter; see docs/heat.md)"
        default: ""
      time_limit:
        description: A test run's seconds, after which the phone restarts into TWRP with the log (0, no limit)
        default: "0"
      tweaks:
        description: ElleKit and PreferenceLoader in the jailbreak prefix (tweak injection; on by default)
        type: boolean
        default: true
      userdata_blocks:
        description: "USERDATA size in 4096-byte blocks, as DEVICE=BLOCKS (S9 64 GB: starlte=13615227); this FORMATS USERDATA and erases Android's data"
        default: "starlte=13615227"

concurrency:
  group: s9-installer
  cancel-in-progress: false

env:
  # everything big lives on /mnt: GitHub's Ubuntu runners have about 14 GB free on / and about 70 GB there
  W: /mnt/w
  THEOS: /mnt/w/theos
  TOOLCHAIN_URL: https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
  SDKS_REPO: https://github.com/theos/sdks.git
  SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/24.08/7z2408-linux-x64.tar.xz
  IPSW_DEVICE: iPhone10,3
  IPSW_BUILD: 20F66
  IPSW_SIZE: "6165698198"

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: The passphrase is set
        env:
          PASS: ${{ secrets.INSTALLER_PASSPHRASE }}
        run: |
          [ -n "$PASS" ] || { echo "::error::set the repository secret INSTALLER_PASSPHRASE: the installer is never uploaded unencrypted"; exit 1; }

      - name: Work space on /mnt
        run: |
          sudo mkdir -p "$W/bin" && sudo chown -R "$(id -u):$(id -g)" "$W"
          echo "$W/bin" >> "$GITHUB_PATH"
          df -h / /mnt

      - name: Host packages, and 7-Zip 24 (unpack.sh reads APFS with it; Ubuntu's p7zip is 16)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential git curl zstd clang lld \
            python3 python3-venv perl xz-utils flex bison m4 autoconf automake libtool-bin uuid-dev llvm \
            meson ninja-build pkg-config hfsprogs
          curl -L --fail --retry 3 -s "$SEVENZIP_URL" | tar -xJ -C "$W/bin" 7zz
          ln -sf 7zz "$W/bin/7z"
          "$W/bin/7z" i | sed -n 2p

      - name: Sources (the kernel repository, this device repository inside it, scion-installer)
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
          PACKAGING_REF: ${{ inputs.packaging_ref }}
        run: |
          git clone -q --filter=blob:none https://github.com/Scion-Project/scion-kernel.git "$W/k"
          git -C "$W/k" checkout -q "$KERNEL_REF"
          git clone -q --filter=blob:none https://github.com/Scion-Project/scion-installer.git "$W/pkg"
          git -C "$W/pkg" checkout -q "$PACKAGING_REF"
          # this run's own commit of the device repository, where tools/hakios-device.py sync would put it
          git clone -q --filter=blob:none "https://github.com/$GITHUB_REPOSITORY.git" "$W/k/devices/starlte"
          git -C "$W/k/devices/starlte" checkout -q "$GITHUB_SHA"
          # the S9+ and the Note9, at the revisions the kernel repository pins
          (cd "$W/k" && python3 tools/hakios-device.py sync star2lte crownlte 2>&1 | tail -3 || true)
          # The kernel's Mesa patches are applied in name order by tools/mk-mesa.sh: panfrost-darwin.patch
          # (29 October) changes the meson.build line that turnip-darwin.patch, last by name, still expects,
          # so the build stops at "1 out of 1 hunk FAILED -- saving rejects to file meson.build.rej". This
          # repository carries the corrected two patches until kernel_ref does; --check makes it a no-op then.
          if git -C "$W/k" apply --check "$W/k/devices/starlte/tools/mesa-patch-order.fix" 2>/dev/null; then
            git -C "$W/k" apply "$W/k/devices/starlte/tools/mesa-patch-order.fix"
            echo "Mesa: the turnip/panfrost patch order fixed"
          else
            echo "Mesa: no patch-order fix needed (kernel_ref already has it, or its patches changed)"
          fi
          for r in "$W/k" "$W/k/devices/starlte" "$W/pkg"; do echo "$r: $(git -C "$r" log --oneline -1)"; done
          echo "MESA_KEY=$(cd "$W/k" && cat tools/mk-mesa.sh tools/mesa/*.patch tools/mesa/hakios-drm/* | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
          echo "DEPS_KEY=$(sha256sum "$W/k/xnu-deps/setup.sh" | cut -c1-16)" >> "$GITHUB_ENV"

      - name: Cache the theos toolchain and SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /mnt/w/theos
          key: theos-iOSToolchain-x86_64-iPhoneOS16.5-v1

      - name: theos (toolchain and iPhoneOS16.5.sdk)
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          mkdir -p "$W/tc" && curl -L --fail --retry 3 -s "$TOOLCHAIN_URL" | tar -xJ -C "$W/tc"
          LD=$(find "$W/tc" -path '*/bin/ld' \( -type f -o -type l \) | head -1)
          test -n "$LD" || { find "$W/tc" -maxdepth 4 | head -50; exit 1; }
          rm -rf "$THEOS/toolchain/linux/iphone" && mv "$(dirname "$(dirname "$LD")")" "$THEOS/toolchain/linux/iphone"
          rm -rf "$W/tc"
          git init -q "$W/sdks" && git -C "$W/sdks" remote add origin "$SDKS_REPO"
          git -C "$W/sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$W/sdks" fetch -q --depth 1 --filter=blob:none origin HEAD && git -C "$W/sdks" checkout -q FETCH_HEAD
          mv "$W/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/" && rm -rf "$W/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: Cache xnu-deps' sources
        uses: actions/cache@v4
        with:
          path: |
            /mnt/w/k/xnu-deps/AvailabilityVersions
            /mnt/w/k/xnu-deps/libdispatch
            /mnt/w/k/xnu-deps/libpthread
            /mnt/w/k/xnu-deps/mm_bootstrap_cmds
            /mnt/w/k/xnu-deps/tcsh
            /mnt/w/k/xnu-deps/unifdef
            /mnt/w/k/xnu-deps/MacOSX13.3.sdk
          key: xnu-deps-src-${{ env.DEPS_KEY }}

      - name: Cache Mesa (built for iOS; keyed on its patches, which is what userland/build.sh checks)
        uses: actions/cache@v4
        with:
          path: /mnt/w/k/xnu-deps/build/mesa/out
          key: mesa-ios-${{ env.MESA_KEY }}

      - name: The S9's configuration, the kernel tree, the dependencies
        working-directory: /mnt/w/k
        run: |
          make starlte_defconfig
          xnu/apply.sh
          xnu-deps/setup.sh || { for f in xnu-deps/*.log; do echo "== $f"; tail -60 "$f"; done; exit 1; }

      - name: iOS 16.5 (20F66) for iPhone10,3, from Apple
        run: |
          curl -s --fail --retry 3 "https://api.ipsw.me/v4/ipsw/$IPSW_DEVICE/$IPSW_BUILD" > "$W/ipsw.json"
          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$W/ipsw.json")
          SHA1=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("sha1sum",""))' "$W/ipsw.json")
          echo "IPSW: $URL"
          curl -L --fail --retry 5 -s -o "$W/ios.ipsw" "$URL"
          size=$(stat -c %s "$W/ios.ipsw")
          [ "$size" = "$IPSW_SIZE" ] || { echo "::error::the IPSW is $size bytes, not $IPSW_SIZE"; exit 1; }
          if [ -n "$SHA1" ]; then
            got=$(sha1sum "$W/ios.ipsw" | cut -d' ' -f1)
            [ "$got" = "$SHA1" ] || { echo "::error::the IPSW's sha1 is $got, not $SHA1"; exit 1; }
          fi
          echo "IPSW checked: $size bytes${SHA1:+, sha1 $SHA1}"

      - name: Unpack the IPSW (sysimage/unpack.sh), then the iPhone identity (xnuloader/mkidentity.sh)
        working-directory: /mnt/w/k
        run: |
          sysimage/unpack.sh "$W/ios.ipsw"
          xnuloader/mkidentity.sh
          rm -f "$W/ios.ipsw"
          df -h /mnt

      - name: The S9 kernel
        working-directory: /mnt/w/k
        run: |
          # Wi-Fi is an object of its own, compiled against the kernel's tree: without it the kernel links and says nothing
          tools/mk-brcmfmac.sh > "$W/brcmfmac.log" 2>&1 || { tail -80 "$W/brcmfmac.log"; exit 1; }
          mkdir -p "$W/kernels"
          for d in starlte star2lte crownlte; do
            make ${d}_defconfig > /dev/null
            rm -f hakios-kernel
            make kernel JOBS="$(nproc)" > "$W/kernel-$d.log" 2>&1 || { tail -80 "$W/kernel-$d.log"; exit 1; }
            cp hakios-kernel "$W/kernels/kernel-$d"
            grep -a 'drivers built in' "$W/kernel-$d.log" | tail -1 || true
          done
          grep -aq 'lx: brcmfmac 2:' "$W/kernels/kernel-starlte" || { echo "::error::the S9's kernel has no Wi-Fi driver in it"; exit 1; }
          # the S9's configuration last, for mkimage.sh's defaults
          make starlte_defconfig > /dev/null

      - name: The loader (with the identity)
        working-directory: /mnt/w/k
        run: make loader

      - name: The small root and the system image (userland/build.sh; Mesa when the cache did not have it)
        working-directory: /mnt/w/k
        env:
          TWEAKS: ${{ inputs.tweaks }}
        run: |
          # Sileo and the Procursus bootstrap, pinned by tools/mk-jb.sh. Unlike scion-installer's
          # build-installer.sh (PREINSTALL= ELLEKIT=), this image carries tweak injection: ElleKit
          # provides mobilesubstrate and loads the tweaks; PreferenceLoader draws their settings panes.
          # unzip, ldid and libplist3 are what tools/ipainstaller uses. tweaks=false keeps ipainstaller,
          # drops ElleKit and PreferenceLoader.
          if [ "$TWEAKS" = "true" ]; then
            export ELLEKIT=0.4.5
            export PREINSTALL="debianutils launchctl preferenceloader unzip ldid libplist3"
          else
            export ELLEKIT=
            export PREINSTALL="debianutils launchctl unzip ldid libplist3"
          fi
          tools/mk-jb.sh > "$W/mk-jb.log" 2>&1 || { tail -60 "$W/mk-jb.log"; exit 1; }
          sh -n devices/starlte/tools/ipainstaller
          install -m 0755 devices/starlte/tools/ipainstaller jb/root/var/jb/usr/bin/ipainstaller
          test -x jb/root/var/jb/usr/bin/ipainstaller
          test -x jb/root/var/jb/usr/bin/unzip
          test -x jb/root/var/jb/usr/bin/ldid
          if [ "$TWEAKS" = "true" ]; then
            test -d jb/root/var/jb/usr/lib/TweakInject || { echo "::error::ElleKit did not install (no usr/lib/TweakInject): does the kernel ref's tools/mk-jb.sh support ELLEKIT?"; exit 1; }
            # ElleKit ships TweakLoader.dylib as an absolute link to /var/jb/usr/lib/ellekit/
            # libinjector.dylib: on the runner /var/jb does not exist, so test -f must not follow
            # it there. Follow it by hand into the tree that becomes /jb; a regular file is taken
            # as it is.
            loader=jb/root/var/jb/usr/lib/TweakLoader.dylib
            if [ -L "$loader" ]; then
              target=$(readlink "$loader")
              case $target in
                /var/jb/*) target=jb/root$target ;;
                /*) target=jb/root/var/jb$target ;;
                *) target=jb/root/var/jb/usr/lib/$target ;;
              esac
            else
              target=$loader
            fi
            test -f "$target" || { echo "::error::ElleKit is not in the prefix (TweakLoader.dylib -> $target is missing)"; exit 1; }
            test -f jb/root/var/jb/usr/lib/ellekit/libinjector.dylib
          fi
          (source ./xnu-env.sh && cd userland && GL=1 NO_AIR=1 REST=1 ALONE=1 RC=rc.launchd BT=1 DEVICE=starlte JB_KEPT_ONLY=1 bash build.sh) > "$W/userland.log" 2>&1 ||
            { tail -100 "$W/userland.log"; find xnu-deps/build -name '*.rej' -print -exec cat {} \; 2>/dev/null; exit 1; }
          tail -5 "$W/userland.log"
          ls -la userland/root.apfs userland/system.apfs

      - name: The installer, S9, S9+ and Note9 (scion-installer universal/mkinstaller.sh), USERDATA formatted
        env:
          PARTITION: ${{ inputs.partition }}
          BOOT_ARGS: ${{ inputs.boot_args }}
          TIME_LIMIT: ${{ inputs.time_limit }}
          USERDATA_BLOCKS: ${{ inputs.userdata_blocks }}
        run: |
          [ -n "$USERDATA_BLOCKS" ] || { echo "::error::userdata_blocks is empty: this workflow always makes /private/var persistent on USERDATA"; exit 1; }
          UARGS=()
          for pair in $USERDATA_BLOCKS; do
            case "$pair" in
              starlte=*|star2lte=*|crownlte=*) ;;
              *) echo "::error::userdata_blocks: $pair is not DEVICE=BLOCKS (starlte, star2lte, crownlte)"; exit 1 ;;
            esac
            case "${pair#*=}" in *[!0-9]*|'') echo "::error::userdata_blocks: ${pair#*=} is not a number of 4096-byte blocks"; exit 1 ;; esac
            UARGS+=(-u "$pair")
          done
          mkdir -p "$W/out"
          SCION_KERNEL="$W/k" "$W/pkg/universal/mkinstaller.sh" -K "$W/k" -s "$W/k/userland/system.apfs" \
            -k starlte="$W/kernels/kernel-starlte" -k star2lte="$W/kernels/kernel-star2lte" -k crownlte="$W/kernels/kernel-crownlte" \
            -r "$W/k/userland/root.apfs" -p "$PARTITION" -t "$TIME_LIMIT" -U "${UARGS[@]}" \
            -a "starlte=shub=6 bt=7 $BOOT_ARGS" -o "$W/out/scion-exynos9810-installer-format-userdata.zip"

      - name: Encrypt it (the installer inside, untouched), and check the archive
        env:
          PASS: ${{ secrets.INSTALLER_PASSPHRASE }}
          PARTITION: ${{ inputs.partition }}
          TIME_LIMIT: ${{ inputs.time_limit }}
        run: |
          P="$W/pack" && mkdir -p "$P"
          mv "$W/out/scion-exynos9810-installer-format-userdata.zip" "$P/"
          (cd "$P" && sha256sum scion-exynos9810-installer-format-userdata.zip > SHA256SUMS)
          cat > "$P/README.txt" <<EOF
          Scion for the Galaxy S9 (SM-G960F), built $(date -u +%Y-%m-%d) by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          kernel repo $(git -C "$W/k" rev-parse --short HEAD), device repo ${GITHUB_SHA::7}, system image to $PARTITION

          THIS INSTALLER FORMATS USERDATA AS HFS PLUS: IT ERASES ANDROID'S DATA IN USERDATA
          (apps, photos, accounts). It is what makes /private/var persistent, so that the jailbreak
          prefix (/var/jb: Sileo, ElleKit, PreferenceLoader, ipainstaller) lasts across boots.

          1. Check the zip: sha256sum -c SHA256SUMS   (or compare with: shasum -a 256 scion-exynos9810-installer-format-userdata.zip)
          2. In TWRP, back up Boot, $PARTITION, EFS and USERDATA first and copy the backup off the phone.
          3. Get the zip onto the phone. It is over 2 GiB and reads itself while it formats USERDATA, so it
             cannot be flashed from internal storage (/sdcard): formatting Data unmounts it. Use a microSD
             card or a USB OTG drive, or put the zip in TWRP's RAM:
               adb shell mount -o remount,size=3G /tmp
               adb push scion-exynos9810-installer-format-userdata.zip /tmp/
               adb shell twrp install /tmp/scion-exynos9810-installer-format-userdata.zip
             (adb sideload does not work: TWRP's sideload host keeps the size in 32 bits.)
          4. Flash scion-exynos9810-installer-format-userdata.zip (Install > the zip > swipe, or the twrp install
             command above). Do not unpack it, and keep "format-userdata" in its file name;
             TWRP's update-binary refuses the zip without it.
          5. Reboot > System. To leave Scion: five fingers held on the screen for 1.5 s (back to TWRP), or Vol Down + Power.
          $([ "$TIME_LIMIT" = 0 ] || echo "   A test run: after $TIME_LIMIT s it restarts into TWRP by itself. Pull the log then (/sys/fs/pstore/pmsg-ramoops-0).")
          Android back: restore the Boot, $PARTITION and USERDATA backups in TWRP.

          After the first boot Sileo appears on the home screen (the prefix is copied to /var/jb about
          30 s after SpringBoard). The IPA installer is /var/jb/usr/bin/ipainstaller; docs/IPA.md says how.
          From a terminal (Sileo > Havoc > NewTerm 3): sudo /var/jb/usr/bin/ipainstaller FILE.ipa
          (mobile's default password is "alpine"; change it with passwd).
          EOF
          A="$W/upload/scion-exynos9810-installer-format-userdata.7z" && mkdir -p "$W/upload"
          (cd "$P" && 7z a -t7z -mx=0 -mhe=on -p"$PASS" "$A" scion-exynos9810-installer-format-userdata.zip SHA256SUMS README.txt > /dev/null)
          # the archive opens with the passphrase, and the zip inside is the one made above
          7z t -p"$PASS" "$A" > /dev/null
          want=$(cut -d' ' -f1 "$P/SHA256SUMS")
          got=$(7z x -so -p"$PASS" "$A" scion-exynos9810-installer-format-userdata.zip | sha256sum | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "::error::the zip inside the archive is not the installer"; exit 1; }
          rm -rf "$P"
          ls -la "$A"
          echo "installer sha256 $want (inside the encrypted archive)"

      - uses: actions/upload-artifact@v4
        with:
          name: scion-exynos9810-installer-format-userdata
          path: /mnt/w/upload/scion-exynos9810-installer-format-userdata.7z
          compression-level: 0
          retention-days: 3

      - name: Build logs (no Apple files in them)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s9-installer-logs
          path: |
            /mnt/w/kernel.log
            /mnt/w/userland.log
            /mnt/w/k/xnu-deps/*.log
          retention-days: 7
          if-no-files-found: ignore
