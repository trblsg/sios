# The Galaxy S9's TWRP installer, built from nothing in one job (Actions > s9-installer > Run workflow).
#
# The job:
#   1. downloads iOS 16.5 (20F66) for iPhone10,3 from Apple's CDN, checked by size and hash;
#   2. unpacks it (sysimage/unpack.sh) and builds the loader's iPhone identity (xnuloader/mkidentity.sh);
#   3. builds the S9 kernel, the loader, Mesa, the small root (ALONE=1 RC=rc.launchd) and the system image;
#      with metal on, also PanVK (Mesa's Vulkan driver for the Mali-G72) and metal2vulkan (the Metal runtime
#      the plug-in opens), so the S9's apps can draw through Metal on Vulkan;
#   4. makes the installer (Scion-Project/scion-installer universal/mkinstaller.sh): Scion's boot image to BOOT,
#      the system image to the partition given (SYSTEM), and a formatted USERDATA: /private/var becomes
#      persistent there (and Android's data in USERDATA is erased).
#
# The image carries the Procursus prefix with Sileo; with tweaks on (the default) ElleKit and PreferenceLoader,
# and ipainstaller at /var/jb/usr/bin/ipainstaller (docs/IPA.md). Its first-boot prep.sh also repairs the
# MobileSafari/SafariViewService container record that native Google sign-in in YouTube and Google Maps needs.
#
# The installer carries iOS's own files. This repository is public, and any signed-in GitHub user can download
# a public repository's artifacts. So the job uploads one 7z archive, AES-256 with its file names encrypted, with
# the passphrase of the repository secret INSTALLER_PASSPHRASE. Without the secret the job stops before it
# builds anything. Inside the archive: the installer zip exactly as TWRP flashes it, its SHA256SUMS and a README.
# Before uploading, the job decrypts its own archive and checks the zip. Artifacts are kept for 3 days.
name: s9-installer

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: trblsg/s-kernel branch, tag or commit (s9/anan has the Anan merge, the Metal code and the camera split; main does not yet)
        default: main
      packaging_ref:
        description: Scion-Project/scion-installer branch, tag or commit
        default: main
      partition:
        description: The partition the iOS system image is written to
        default: SYSTEM
      boot_args:
        description: "Extra boot-arguments (for example mali=9, or max77705_wdt=1 max77705_diag=1 max77705_fg_s=30 tmu=3 fps_log=1; for screen-on heat add gov_policy=2 cpufreq_gov_big_max=1469000 mali_gov_frame=455; for P12.3.1 use kernel_ref=s9/p12-3-1-thermal-attribution with hi=2 panel=1 p122=1 p12_gpu_boot_auto=1 mali_gov=1 mali_gov_frame=450 mali_probe=1 p3power=1; panel=1 enables the panel driver, NOT DCS sleep; do NOT use panel_sleep=1, p9_panel_mode=1 or sleep_cores=1 (panel wake corruption and CPU3 restart fault); bt=0 wifi_pcie=0 turns the radios off for a test; vmd=0 (new image) leaves the voicemail daemon out; gov_policy=3 can be hotter; see docs/heat.md)"
        default: ""
      metal:
        description: "Metal on Vulkan for the S9's Mali-G72, on by default: build PanVK and metal2vulkan and boot apps on Metal (metal=2 camtl=0; the window server stays GLES). Set false for a GLES-only image (metal=0). Use kernel_ref=s9/anan and fps=true or this input to log fps: for tools/fps.py"
        type: boolean
        default: true
      fps:
        description: "Add fps_log=1 to the boot-arguments: the kernel writes an fps: line a second while frames come, for tools/fps.py (it is added by metal=true as well)"
        type: boolean
        default: false
      time_limit:
        description: A test run's seconds, after which the phone restarts into TWRP with the log (0, no limit)
        default: "0"
      tweaks:
        description: ElleKit and PreferenceLoader in the jailbreak prefix (tweak injection; on by default)
        type: boolean
        default: true
      userdata_blocks:
        description: "Devices to build and format, as DEVICE=BLOCKS of 4096 bytes (test S9: starlte=13917184); only listed models are packaged. WARNING: formats USERDATA and erases Android data"
        default: "starlte=13917184"

concurrency:
  group: s9-installer
  cancel-in-progress: false

env:
  # everything big lives on /mnt: GitHub's Ubuntu runners have about 14 GB free on / and about 70 GB there
  W: /mnt/w
  THEOS: /mnt/w/theos
  TOOLCHAIN_URL: https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
  SDKS_REPO: https://github.com/theos/sdks.git
  SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/24.08/7z2408-linux-x64.tar.xz
  IPSW_DEVICE: iPhone10,3
  IPSW_BUILD: 20F66
  IPSW_SIZE: "6165698198"

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: The passphrase is set
        env:
          PASS: ${{ secrets.INSTALLER_PASSPHRASE }}
        run: |
          [ -n "$PASS" ] || { echo "::error::set the repository secret INSTALLER_PASSPHRASE: the installer is never uploaded unencrypted"; exit 1; }

      - name: Refuse truncated S9 boot-args BEFORE building
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
          BOOT_ARGS: ${{ inputs.boot_args }}
          METAL_ARGS: ${{ inputs.metal && 'metal=2 camtl=0' || 'metal=0' }}
          FPS_ARGS: ${{ (inputs.fps || inputs.metal) && 'fps_log=1' || '' }}
        run: |
          # P12.2 includes the P9 panel driver. Request its initialization
          # explicitly; panel=1 is NOT panel_sleep=1 or p9_panel_mode=1.
          # Reject missing bootargs here, before expensive package downloads.
          case "$KERNEL_REF" in
            s9/p12-*)
              case " $BOOT_ARGS " in
                *" panel=1 "*) ;;
                *) echo '::error::P12.2 requires panel=1 in boot_args to initialize S6E3HA8; keep panel_sleep=1 and p9_panel_mode=1 DISABLED'; exit 1 ;;
              esac ;;
          esac
          ARGS="$BOOT_ARGS"
          for arg in $FPS_ARGS $METAL_ARGS; do
            name=${arg%%=*}
            case " $ARGS " in *" $name="*) ;; *) ARGS="$arg $ARGS" ;; esac
          done
          EXTRA="shub=6 bt=7 $ARGS"
          N=$(printf '%s' "$EXTRA" | LC_ALL=C wc -c | tr -d '[:space:]')
          # On the tested 20F66 S9 kernel the loader prepends ~300 bytes;
          # 607 is the payload limit. Leave 27 extra bytes of headroom.
          echo "S9 cmdline budget: -a extras $N / 280 bytes; overall cap 607"
          if [ "$N" -gt 280 ]; then
            echo "::error::boot_args too long: -a payload $N bytes exceeds S9 safe limit 280. Last boot silently dropped max77705_fg_s. Shorten before building."
            exit 1
          fi

      - name: Work space on /mnt
        run: |
          sudo mkdir -p "$W/bin" && sudo chown -R "$(id -u):$(id -g)" "$W"
          echo "$W/bin" >> "$GITHUB_PATH"
          df -h / /mnt

      - name: Host packages, and 7-Zip 24 (unpack.sh reads APFS with it; Ubuntu's p7zip is 16)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential git curl zstd clang lld \
            python3 python3-venv perl libdigest-sha-perl xz-utils flex bison m4 autoconf automake libtool-bin uuid-dev llvm \
            meson ninja-build pkg-config patch hfsprogs
          curl -L --fail --retry 3 -s "$SEVENZIP_URL" | tar -xJ -C "$W/bin" 7zz
          ln -sf 7zz "$W/bin/7z"
          "$W/bin/7z" i | sed -n 2p

      - name: Sources (the kernel repository, this device repository inside it, scion-installer)
        id: sources
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
          BOOT_ARGS: ${{ inputs.boot_args }}
          PACKAGING_REF: ${{ inputs.packaging_ref }}
          USERDATA_BLOCKS: ${{ inputs.userdata_blocks }}
        run: |
          # the fork carries the IRQ work (irq-fallback); upstream is Scion-Project/scion-kernel
          git clone -q --filter=blob:none https://github.com/trblsg/s-kernel.git "$W/k"
          git -C "$W/k" checkout -q "$KERNEL_REF"
          # P10 MUST run with hi=2, even for a SHA-pinned kernel_ref.
          # The hi=2 source-verification block below would otherwise be
          # skipped ENTIRELY by passing hi=0, silently building P10 with no
          # SpringBoard lockscreen hook. Fail before any expensive build.
          if [ -s "$W/k/docs/s9-p10-lockscreen-source-guard.md" ] &&
             [[ " $BOOT_ARGS " != *" hi=2 "* ]]; then
            echo "::error::P10 source requires hi=2 (refuse bypassed lockscreen hook)"
            exit 1
          fi
          # One-boot deep Home experiment MUST carry the matched kernel
          # mailbox, full SpringBoard hooks and autonomous A/B in the same
          # kernel_ref. Stop before the expensive Mesa/iOS build otherwise.
          case " $BOOT_ARGS " in
            *" hi=2 "*)
              echo "S9 hi=2 preflight: kernel_ref=$KERNEL_REF commit=$(git -C "$W/k" rev-parse --short HEAD)"
              for src in userland/src/s9_home_idle.inc userland/src/s9_home_idle_auto.inc \
                         userland/src/s9_home_idle_detail.inc userland/src/s9_home_idle_scene.inc \
                         userland/src/s9_hi_auto_policy.h userland/src/s9_hi_verified_policy.h \
                         userland/src/s9_hi_clock_resolve.inc \
                         drivers/gpu/mali/hakios.p7_gpu_lab.h \
                         drivers/power/exynos/hakios.p7_cpu_lab.h \
                         tools/s9-home-idle-serial-auto.ps1 tools/s9-p7-power-ab.inc.ps1 \
                         tools/s9-home-idle-report.ps1 tools/s9-p7-basepower-report.ps1 \
                         docs/s9-p7-clock-basepower-unified.md docs/s9-p7-power-ab-run.md; do
                [ -s "$W/k/$src" ] || { echo "::error::hi=2 requires kernel source $src (BOOT and SYSTEM must match)"; exit 1; }
              done
              grep -Fq 'hi_auto_arg = strstr(arguments, "hi=2")' "$W/k/userland/src/inject_sb.c" ||
                { echo "::error::kernel_ref lacks hi=2 boot activation in SpringBoard"; exit 1; }
              grep -Fq 'hi_cmd, CTLFLAG_RW | CTLFLAG_LOCKED | CTLFLAG_ANYBODY | CTLFLAG_KERN' "$W/k/drivers/gpu/mali/hakios.mali.c" ||
                { echo "::error::kernel_ref lacks the USB kernel CTLFLAG_KERN fix (hi_cmd would return EPERM)"; exit 1; }
              grep -Fq 'hi_auto_tick();' "$W/k/userland/src/s9_home_idle.inc" ||
                { echo "::error::hi=2 autonomous source-cut control was not integrated"; exit 1; }
              grep -Fq 'if(command==252){hi_auto_rearm();return;}' "$W/k/userland/src/s9_home_idle.inc" ||
                { echo "::error::hi=2 USB serial script requires verified 252 rearm (late COM attachment)"; exit 1; }
              grep -Fq 'if(command==300){hi_open_settings(false);return;}' "$W/k/userland/src/s9_home_idle.inc" ||
                { echo "::error::hi=2 USB serial script requires 300 Settings URL route"; exit 1; }
              grep -Fq 'if(command==301){hi_open_settings(true);return;}' "$W/k/userland/src/s9_home_idle.inc" ||
                { echo "::error::hi=2 USB serial script requires 301 Settings fallback route"; exit 1; }
              grep -Fq 'SBSOpenSensitiveURLAndUnlock' "$W/k/userland/src/s9_home_idle_scene.inc" ||
                { echo "::error::hi=2 Settings foreground launch helper missing"; exit 1; }
              # P7 pairing: reject a build that would ship Clock A/B but NOT
              # the opt-in verified-owner Clock policy and PMU/CPU diagnostics.
              grep -Fq 'hi_verified_should_skip(' "$W/k/userland/src/s9_home_idle.inc" ||
                { echo "::error::P7 Clock owner-verified source path missing"; exit 1; }
              grep -Fq "method_getReturnType(getter,return_type,sizeof(return_type))" "$W/k/userland/src/s9_hi_clock_resolve.inc" ||
                { echo "::error::P7 Clock getter ABI guard missing (SpringBoard crash risk)"; exit 1; }
              grep -Fq 'Test-SysctlReadback' "$W/k/tools/s9-home-idle-serial-auto.ps1" ||
                { echo "::error::P7 USB host script does not verify actual sysctl readback"; exit 1; }
              grep -Fq 'Confirm-G3DRestored' "$W/k/tools/s9-home-idle-serial-auto.ps1" ||
                { echo "::error::P7 G3D ON/PLL/TZ restore verification missing"; exit 1; }
              grep -Fq 's9-p7-power-ab.inc.ps1' "$W/k/tools/s9-home-idle-serial-auto.ps1" &&
              grep -Fq 'P7-Run-G3DAB' "$W/k/tools/s9-p7-power-ab.inc.ps1" &&
              grep -Fq 'P7-Run-CPUAB' "$W/k/tools/s9-p7-power-ab.inc.ps1" &&
              grep -Fq 'P7-VerifyCpuRestored' "$W/k/tools/s9-p7-power-ab.inc.ps1" ||
                { echo "::error::P7 dedicated one-command G3D/CPU A/B/A host scripts missing"; exit 1; }
              grep -Fq 'LeaveP7AuditRunning' "$W/k/tools/s9-home-idle-serial-auto.ps1" ||
                { echo "::error::P7 battery-only ring capture not supported in Windows script"; exit 1; }
              grep -Fq 'hi_policy,' "$W/k/drivers/gpu/mali/hakios.mali.c" ||
                { echo "::error::P7 hi_policy sysctl missing"; exit 1; }
              grep -Fq 'p7_gpu_gate_watchdog(now);' "$W/k/drivers/gpu/mali/hakios.mali_lab.h" ||
                { echo "::error::P7 G3D autonomous expiry missing"; exit 1; }
              grep -Fq 'gpu/mali bsd/dev/hakios.p7_gpu_lab.h' "$W/k/drivers/map" &&
              grep -Fq 'power/exynos bsd/dev/hakios.p7_cpu_lab.h' "$W/k/drivers/map" ||
                { echo "::error::P7 driver headers are not mapped into XNU (compile would fail)"; exit 1; }
              grep -Fq 'char s[512]' "$W/k/drivers/usb/hakios.dwc3.c" &&
              grep -Fq 'char line[768]' "$W/k/drivers/usb/hakios.dwc3.c" ||
                { echo "::error::USB sysctl 256/300-byte legacy buffers would truncate P7 stats"; exit 1; }
              grep -Fq 'p7_cpu_probe(now);' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" ||
                { echo "::error::P7 CPU governor ring not integrated"; exit 1; }
              grep -Fq 'p7_cpu_park' "$W/k/drivers/power/exynos/hakios.p7_cpu_lab.h" ||
                { echo "::error::P7 CPU_OFF opt-in control missing"; exit 1; }
              grep -Fq 'hakios_p7_cpu_park(unsigned enable)' "$W/k/xnu/files/GenericARMPE.cpp" ||
                { echo "::error::P7 matching GenericARMPE CPU power control missing"; exit 1; }
              # P7 legacy build tested screen-off CPU_OFF; P8 must NEVER do so.
              # P8 has two independent EPERM guards and therefore does not
              # require sleep_cores=1 (avoid even allocating the old worker).
              if [ -s "$W/k/docs/s9-p8-unified-power-m3-lab.md" ]; then
                echo 'P8: no sleep_cores boot argument required; CPU_OFF interlocked'
              else
                case " $BOOT_ARGS " in
                  *" sleep_cores=1 "*) ;;
                  *) echo "::error::P7 single build requires sleep_cores=1 for later runtime CPU_OFF tests (default runtime gate remains OFF)"; exit 1;;
                esac
              fi
              # A P8 image MUST ship both layers of the M3 CPU_OFF lock,
              # retained kernel PMU/PSCI/thermal telemetry, long GPU ring,
              # and the paired Windows host+report. Check when P8 sources
              # are present so pinned commit SHA refs work as well.
              case "$KERNEL_REF" in
                s9/p8-*) [ -s "$W/k/docs/s9-p8-unified-power-m3-lab.md" ] || {
                  echo "::error::P8 kernel_ref missing P8 source/doc: refuse mismatched BOOT+SYSTEM"; exit 1; } ;;
              esac
              if [ -s "$W/k/docs/s9-p8-unified-power-m3-lab.md" ]; then
                echo "S9 P8 preflight: enforcing 2026-11-23 CPU3 re-entry safety on $(git -C "$W/k" rev-parse --short HEAD)"
                for src in drivers/power/exynos/hakios.p8_unified_lab.h \
                           drivers/soc/exynos/hakios.p8_soc_snapshot.h \
                           tools/s9-p8-unified-serial.inc.ps1 tools/s9-p8-report.ps1 \
                           tools/tests/test-s9-p8-unified.ps1 \
                           tools/tests/s9-p8-reentry-negative-fixture.log \
                           docs/s9-p8-unified-power-m3-lab.md; do
                  [ -s "$W/k/$src" ] || { echo "::error::P8 missing matched source $src"; exit 1; }
                done
                grep -Fq 'p8-safety: BIG CPU_OFF REFUSED' "$W/k/xnu/files/GenericARMPE.cpp" &&
                grep -Fq 'if(value==1)return EPERM;' "$W/k/drivers/power/exynos/hakios.p7_cpu_lab.h" ||
                  { echo "::error::P8 kernel must block legacy M3 CPU_OFF at TWO layers"; exit 1; }
                grep -Fq '#define P8_RING 512u' "$W/k/drivers/power/exynos/hakios.p8_unified_lab.h" &&
                grep -Fq '#define P7_GPU_RING 512u' "$W/k/drivers/gpu/mali/hakios.p7_gpu_lab.h" &&
                grep -Fq 'hakios_p8_psci_snapshot' "$W/k/xnu/files/psci_smp.c" &&
                grep -Fq 'hakios_p8_m3_snapshot' "$W/k/drivers/soc/exynos/hakios.exynos_m3.c" &&
                grep -Fq 'p8_probe(now);' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" &&
                grep -Fq 'max = MIN(max,p8_cap)' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" ||
                  { echo "::error::P8 PMU/PSCI ring and lower-only thermal cap absent"; exit 1; }
                grep -Fq 'power/exynos bsd/dev/hakios.p8_unified_lab.h' "$W/k/drivers/map" &&
                grep -Fq 'soc/exynos bsd/dev/hakios.p8_soc_snapshot.h' "$W/k/drivers/map" &&
                grep -Fq 'drivers/soc/exynos/hakios.p8_soc_snapshot.h osfmk/arm64/hakios.p8_soc_snapshot.h' "$W/k/profiles/ios-16.5.copy" &&
                grep -Fq '#include <arm64/hakios.p8_soc_snapshot.h>' "$W/k/xnu/files/psci_smp.c" &&
                grep -Fq 's9-p8-unified-serial.inc.ps1' "$W/k/tools/s9-home-idle-serial-auto.ps1" &&
                grep -Fq 'P8 HARDWARE SAFETY' "$W/k/tools/s9-home-idle-serial-auto.ps1" &&
                grep -Fq 'P8 CPU RE-ENTRY / POWER FAULT' "$W/k/tools/s9-p8-report.ps1" ||
                  { echo "::error::P8 BOOT+SYSTEM/USB/parser pairing incomplete"; exit 1; }
                if grep -Fq 'p7_cpu_park=1' "$W/k/tools/s9-p8-unified-serial.inc.ps1"; then
                  echo "::error::P8 passive automation must never request destructive M3 CPU_OFF"; exit 1
                fi
                echo 'S9 P8 preflight: PASS; CPU_OFF refused, PMU+PSCI+thermal+GPU rings and reports paired'
              fi
              # P9: one image with ACTUAL screen-OFF GPU power gate,
              # Samsung DCS sleep/wake, adaptive touch+USB and the
              # narrowly allowlisted SpringBoard Clock source correction.
              # A SHA-pinned kernel_ref is accepted only if its tree passes.
              case "$KERNEL_REF" in
                s9/p9-*) [ -s "$W/k/docs/s9-p9-screen-off-power-fix.md" ] || {
                  echo "::error::P9 kernel_ref lacks P9 source/doc; refusing mismatched BOOT+SYSTEM"; exit 1; } ;;
              esac
              if [ -s "$W/k/docs/s9-p9-screen-off-power-fix.md" ]; then
                echo "S9 P9 paired source preflight: $(git -C "$W/k" rev-parse --short HEAD)"
                for src in drivers/gpu/mali/hakios.mali_lab.h \
                           drivers/display/panel/hakios.s6e3ha8.c \
                           drivers/input/touch/hakios.s6sy761.c \
                           drivers/usb/hakios.dwc3.c \
                           drivers/power/exynos/hakios.exynos_cpufreq.c \
                           userland/src/s9_p9_clock_policy.h \
                           tools/s9-p9-power-fix.inc.ps1 \
                           tools/tests/test-s9-p9-power-fix.ps1 \
                           docs/s9-p9-screen-off-power-fix.md; do
                  [ -s "$W/k/$src" ] || { echo "::error::P9 missing $src in matched kernel"; exit 1; }
                done
                case " $BOOT_ARGS " in
                  *" panel=1 "*) ;;
                  *) echo "::error::P9 S6E3HA8 driver requires panel=1 in boot_args (initialization only; panel DCS sleep is disabled)"; exit 1 ;;
                esac
                case " $BOOT_ARGS " in
                  *" mali_gov=1 "*) ;;
                  *) echo "::error::P9 G3D auto gate requires mali_gov=1"; exit 1 ;;
                esac
                case " $BOOT_ARGS " in
                  *" sleep_cores=1 "*|*" panel_sleep=1 "*)
                    echo "::error::P9 forbids P7 CPU_OFF and boot-time panel sleep; use safe runtime P9 switches"; exit 1 ;;
                esac
                grep -Fq 'p9_auto_gpu_sysctl' "$W/k/drivers/gpu/mali/hakios.mali_lab.h" &&
                grep -Fq 'gate_mode == 2 && hakios_display_requested_on() != 0' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq '!g3d_awake && !g3d_power_on()' "$W/k/drivers/gpu/mali/hakios.mali_lab.h" &&
                grep -Fq 'gPanelSleep || hakios_p9_panel_auto_on()' "$W/k/xnu/files/GenericARMPE.cpp" &&
                grep -Fq 'p9_panel_mode_sysctl' "$W/k/drivers/display/panel/hakios.s6e3ha8.c" &&
                grep -Fq 'p9_touch_off_ms_sysctl' "$W/k/drivers/input/touch/hakios.s6sy761.c" &&
                grep -Fq 'p9_usb_off_ms_sysctl' "$W/k/drivers/usb/hakios.dwc3.c" &&
                grep -Fq 'p9_wake_guard_sysctl' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" &&
                grep -Fq 's9_p9_hidden_clock_skip' "$W/k/userland/src/s9_home_idle.inc" &&
                grep -Fq 'P9 REAL HARDWARE PASS' "$W/k/tools/s9-p9-power-fix.inc.ps1" &&
                grep -Fq 'P9Fix' "$W/k/tools/s9-home-idle-serial-auto.ps1" &&
                grep -Fq 'p8-safety: BIG CPU_OFF REFUSED' "$W/k/xnu/files/GenericARMPE.cpp" ||
                  { echo "::error::P9 hardware source fix/rollback or CPU_OFF interlock missing"; exit 1; }
                echo 'S9 P9 preflight PASS: GPU physical OFF/ON, panel DCS, touch/USB, Clock, wake cap and P7 CPU_OFF lock'
              fi
              # P10: userland-exact lockscreen timer source policy, independent
              # of P9 physical G3D gate. Both linked BOOT and SYSTEM are pinned
              # to the SAME source SHA. Refuse missing verified lock state or
              # unsafe general CA/present skip, and KEEP panel DCS disabled.
              case "$KERNEL_REF" in
                s9/p10-*) [ -s "$W/k/docs/s9-p10-lockscreen-source-guard.md" ] || {
                  echo "::error::P10 kernel_ref lacks Lock Screen source guard doc"; exit 1; } ;;
              esac
              if [ -s "$W/k/docs/s9-p10-lockscreen-source-guard.md" ]; then
                echo "S9 P10 paired kernel/userland preflight $(git -C "$W/k" rev-parse --short HEAD)"
                case " $BOOT_ARGS " in
                  *" hi=2 "*) ;;
                  *) echo "::error::P10 requires hi=2 for SpringBoard source-level hook"; exit 1 ;;
                esac
                for src in userland/src/s9_p10_lock_scene.inc \
                           userland/src/s9_p10_lock_policy.h \
                           userland/src/s9_home_idle.inc \
                           userland/src/inject.c \
                           tools/tests/test_s9_p10_lock_policy.c \
                           tools/tests/test-s9-p10-lockscreen-source.ps1 \
                           docs/s9-p10-lockscreen-source-guard.md; do
                  [ -s "$W/k/$src" ] || { echo "::error::P10 missing $src"; exit 1; }
                done
                grep -Fq 'hi_lock_policy_sysctl' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'hi_display_requested_sysctl' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 's9_p10_source' "$W/k/userland/src/s9_home_idle.inc" &&
                grep -Fq 'hi_p10_maybe_skip' "$W/k/userland/src/s9_home_idle.inc" &&
                grep -Fq 'hi_p10_is_locked()' "$W/k/userland/src/s9_p10_lock_scene.inc" &&
                grep -Fq 'SBLockScreenManager' "$W/k/userland/src/s9_p10_lock_scene.inc" &&
                grep -Fq 'SBCoverSheetWindow' "$W/k/userland/src/s9_p10_lock_scene.inc" &&
                grep -Fq 'hi_count_animations' "$W/k/userland/src/s9_p10_lock_scene.inc" &&
                grep -Fq 'S9_P10_PROOF_FRESH_US' "$W/k/userland/src/s9_p10_lock_policy.h" &&
                grep -Fq 'render_update_always_forwarded=1' "$W/k/userland/src/inject.c" &&
                grep -Fq "Send-Checked 'sysctl kern.hakios.p9_panel_mode=0'" "$W/k/tools/s9-p9-power-fix.inc.ps1" &&
                grep -Fq 'P9 PANEL BYPASS VERIFIED' "$W/k/tools/s9-p9-power-fix.inc.ps1" ||
                  { echo "::error::P10 source verification/tear-free P9.1 recovery missing"; exit 1; }
                if grep -Fq "Send-Checked 'sysctl kern.hakios.p9_panel_mode=1'" "$W/k/tools/s9-p9-power-fix.inc.ps1"; then
                    echo "::error::P10 must not re-enable the known bad Samsung panel DCS path"; exit 1
                fi
                echo 'S9 P10 preflight PASS: exact lockscreen timers, verified lock/cover, full animation quiet guard, always-forward CA, P9.1 tear-free DCS bypass'
              fi
              # P12: matched thermal + physical idle work in ONE BOOT/SYSTEM.
              # Source is pinned by kernel_ref before either image is built.
              case "$KERNEL_REF" in
                s9/p12-*) [ -s "$W/k/docs/s9-p12-thermal-deep-idle.md" ] || {
                  echo "::error::P12 kernel_ref lacks matched P12 thermal/idle source"; exit 1; } ;;
              esac
              if [ -s "$W/k/docs/s9-p12-thermal-deep-idle.md" ]; then
                echo "S9 P12 paired BOOT/SYSTEM/host preflight: $(git -C "$W/k" rev-parse HEAD)"
                # P12 GPU power-gate is intentionally opt-in. A missing
                # boot arg must not block CPU thermal diagnostics or WFI
                # instrumentation; importantly, it must NEVER be described
                # as an active GPU-gate build unless =1 is actually present.
                p12_gpu_seen=0
                p12_gpu_value=0
                for token in $BOOT_ARGS; do
                  case "$token" in
                    p12_gpu_boot_auto=0|p12_gpu_boot_auto=1)
                      p12_gpu_seen=$((p12_gpu_seen + 1))
                      p12_gpu_value=${token#*=} ;;
                    p12_gpu_boot_auto=*)
                      echo "::error::P12 p12_gpu_boot_auto must be 0 or 1: $token"
                      exit 1 ;;
                  esac
                done
                if [ "$p12_gpu_seen" -gt 1 ]; then
                  echo "::error::P12 duplicated p12_gpu_boot_auto= boot-arg (ambiguous kernel behavior)"
                  exit 1
                fi
                if [ "$p12_gpu_value" = 1 ]; then
                  echo 'S9 P12 GPU physical OFF: p12_gpu_boot_auto=1 requested; actual gate still depends on P9 safety and PMU readbacks'
                else
                  echo '::warning::S9 P12 GPU auto-gate NOT enabled (p12_gpu_boot_auto absent or 0). CPU thermal/WFI build continues; to test physical GPU OFF, rerun with p12_gpu_boot_auto=1.'
                fi
                # P12.2 is a paired causal-diagnostics build: require its
                # userland hook, not just a kernel sysctl that silently
                # records no GL data. Distinguish default minimal from
                # old glcost/glstage/checksum profilers before building.
                p122_seen=0
                for token in $BOOT_ARGS; do
                  case "$token" in
                    p122=1) p122_seen=$((p122_seen + 1)) ;;
                    p122=*) echo "::error::P12.2 p122 must equal 1: $token"; exit 1 ;;
                  esac
                done
                if [ "$p122_seen" -ne 1 ]; then
                  echo '::error::P12.2 requires exactly one p122=1 in boot_args (new matched GLES diagnostics)'
                  exit 1
                fi
                for required_p122 in mali_gov=1 mali_gov_frame=450 mali_probe=1; do
                  case " $BOOT_ARGS " in
                    *" $required_p122 "*) ;;
                    *) echo "::error::P12.2 baseline requires $required_p122 (matched GPU DVFS/clock-floor observer)"; exit 1 ;;
                  esac
                done
                for unsafe_diag in glcost=1 glstage=1 glpath=1 glhash=1 p0hash=1 p0verify=1 glerrors=1 glerrors=2 g2_bind=1 g21_diag=1 g2_verify=1; do
                  case " $BOOT_ARGS " in
                    *" $unsafe_diag "*) echo "::error::P12.2 causal baseline forbids pre-enabled per-call profiler: $unsafe_diag"; exit 1 ;;
                  esac
                done
                # P12.3.1 validates exact 3/4-level tables at runtime;
                # keep the original frame floor and no conflicting values.
                for key in mali_gov mali_gov_frame mali_probe; do
                  count=0
                  for token in $BOOT_ARGS; do
                    case "$token" in "$key"=*) count=$((count + 1));; esac
                  done
                  [ "$count" -eq 1 ] || { echo "::error::P12.3 duplicated or missing $key"; exit 1; }
                done
                for token in $BOOT_ARGS; do
                  case "$token" in
                    glprof=*|gltrace=*)
                      echo "::error::P12.2 cannot use heavyweight GL stack/per-call tracing in BOOT: $token"; exit 1 ;;
                  esac
                done
                for unsafe in sleep_cores=1 syssleep=1 panel_sleep=1 p9_panel_mode=1 mali_dvs=1; do
                  case " $BOOT_ARGS " in
                    *" $unsafe "*) echo "::error::P12 forbids unproven power path: $unsafe"; exit 1 ;;
                  esac
                done
                for src in drivers/power/exynos/hakios.p12_thermal.h \
                           tools/tests/test_s9_p12_thermal_policy.c \
                           drivers/power/exynos/hakios.exynos_cpufreq.c \
                           drivers/gpu/mali/hakios.mali_lab.h \
                           drivers/gpu/mali/hakios.mali.c \
                           xnu/files/cpu.c userland/src/inject.c \
                           drivers/gpu/mali/hakios.p122_diag.h \
                           userland/src/s9_p122_frame_diag.h \
                           tools/s9-p12-dual-serial.ps1 \
                           tools/s9-p122-rootcause-serial.ps1 \
                           tools/s9-screen-lifecycle-serial.ps1 \
                           tools/tests/test-s9-p12-dual-serial.ps1 \
                           tools/tests/test-s9-p122-rootcause-serial.ps1 \
                           tools/tests/test_s9_p122_rootcause.c \
                           docs/s9-p12-thermal-deep-idle.md \
                           docs/s9-p122-rootcause.md \
                           docs/s9-p123-source-attribution.md \
                           tools/tests/test-s9-p123-source-serial.ps1 \
                           userland/src/s9_hi_clock_resolve.inc \
                           userland/src/inject_sb.c; do
                  [ -s "$W/k/$src" ] || { echo "::error::P12 missing paired source: $src"; exit 1; }
                done
                grep -Fq 'power/exynos bsd/dev/hakios.p12_thermal.h' "$W/k/drivers/map" &&
                grep -Fq '#include "hakios.p12_thermal.h"' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" &&
                grep -Fq 'p12_cpu_mode_sysctl' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" &&
                grep -Fq 'p12_wfi_stats_sysctl' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" &&
                grep -Fq 'p12_idle_diag_sysctl' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" &&
                grep -Fq 'hakios_p12_wfi_entries' "$W/k/xnu/files/cpu.c" &&
                grep -Fq 'hakios_p12_idle_enter' "$W/k/xnu/files/cpu.c" &&
                grep -Fq 'hakios_p12_idle_denied' "$W/k/xnu/files/cpu.c" &&
                grep -Fq 'hakios_p12_idle_wfi_path' "$W/k/xnu/files/cpu.c" &&
                grep -Fq 'p12_gpu_boot_enable' "$W/k/drivers/gpu/mali/hakios.mali_lab.h" &&
                grep -Fq 'p12_gpu_boot_auto' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'p12_gpu_boot_stats_sysctl' "$W/k/drivers/gpu/mali/hakios.mali_lab.h" &&
                grep -Fq 'g3d_lab_stats_sysctl' "$W/k/drivers/gpu/mali/hakios.mali_lab.h" &&
                grep -Fq 'g3d_lab_protection_ok' "$W/k/drivers/gpu/mali/hakios.mali_lab.h" &&
                grep -Fq 'p122_diag_mode_sysctl' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'p122_gpu_stats_sysctl' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'p122_job_latency' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'p122_gov_forced' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'p123_floor_mode_sysctl' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'p123_floor_stats_sysctl' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 's9_p123_floor_eligible' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                grep -Fq 'hakios_p123_input_quiet' "$W/k/drivers/power/exynos/hakios.exynos_cpufreq.c" &&
                grep -Fq 'p123-clock-class:' "$W/k/userland/src/s9_hi_clock_resolve.inc" &&
                grep -Fq 'crossover_requires_explicit_252' "$W/k/userland/src/s9_home_idle.inc" &&
                grep -Fq 'p123-clock-window:' "$W/k/userland/src/s9_home_idle.inc" &&
                grep -Fq 'p123-ca-window:' "$W/k/userland/src/inject.c" &&
                grep -Fq 'p123-gl-window:' "$W/k/userland/src/eagl.c" &&
                grep -Fq 'P123-FloorProfile' "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq 'P123-ClockTrial' "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq "P12-Query 'p123_floor_mode' '0' -Cleanup" "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq 'p122-gl: mode=%d ack=kernel_sysctl' "$W/k/userland/src/eagl.c" &&
                grep -Fq 'p122-gl-window:' "$W/k/userland/src/eagl.c" &&
                grep -Fq 's9_p122_frame_add' "$W/k/userland/src/eagl.c" &&
                grep -Fq 'P122-Profile 0' "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq 'P122-Profile 1' "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq 'P122-Profile 2' "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq 'P122-Deltas' "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq "P12-Query 'p122_diag_mode' '0' -Cleanup" "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                grep -Fq 'P12-CoolStart 12' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'P12-EarlyThermalGuard' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'P12-QuiesceHI2' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'P12HiGateStopSeen' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'if($InteractiveAB)' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'P12-Observe '\''PASSIVE_ON'\''' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'if(-not $Cleanup){Life-CheckSafety' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'P12.1 MANUAL_WAKE VERIFIED' "$W/k/tools/s9-p12-dual-serial.ps1" &&
                grep -Fq 'if(command==0 || command==201)' "$W/k/userland/src/s9_home_idle.inc" &&
                grep -Fq 'S9 P12.1 NATURAL SCREEN LIFECYCLE' "$W/k/tools/s9-screen-lifecycle-serial.ps1" &&
                grep -Fq 'p12-ca: forwarded=' "$W/k/userland/src/inject.c" &&
                grep -Fq 'orig_render_update(server, update, flags)' "$W/k/userland/src/inject.c" &&
                grep -Fq 'if(value==1)return EPERM;' "$W/k/drivers/power/exynos/hakios.p7_cpu_lab.h" &&
                grep -Fq 'p8-safety: BIG CPU_OFF REFUSED' "$W/k/xnu/files/GenericARMPE.cpp" &&
                grep -Fq 'int hakios_p9_panel_auto_on(void) { return 0; }' "$W/k/drivers/core/hakios.stubs.c" ||
                  { echo "::error::P12 hardware interlock, source pairing or guarded thermal logic missing"; exit 1; }
                cc -std=c11 -O2 -Wall -Wextra -Werror \
                   "$W/k/tools/tests/test_s9_p12_thermal_policy.c" \
                   -o "$W/bin/s9-p12-policy" &&
                "$W/bin/s9-p12-policy" ||
                  { echo "::error::P12 C11 no-touch/late-frame power guard regression failed"; exit 1; }
                cc -std=c11 -O2 -Wall -Wextra -Werror \
                   "$W/k/tools/tests/test_s9_p122_rootcause.c" \
                   -o "$W/bin/s9-p122-rootcause" &&
                "$W/bin/s9-p122-rootcause" ||
                  { echo "::error::P12.2 C11 histogram and mode guard regression failed"; exit 1; }
                case "$KERNEL_REF" in
                  s9/p12-3-1-*)
                    for src in docs/s9-p1231-thermal-attribution.md tools/tests/test-s9-p1231-thermal-serial.ps1; do
                      [ -s "$W/k/$src" ] || { echo "::error::P12.3.1 missing paired source $src"; exit 1; }
                    done
                    grep -Fq 's9_p1231_rates_valid' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                    grep -Fq 'level572_ns=' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                    grep -Fq 'p1231_hash_mode_sysctl' "$W/k/drivers/gpu/mali/hakios.mali.c" &&
                    grep -Fq 'cpu_data_ptr->cpu_number; /* cpu_id is an opaque PE object' "$W/k/xnu/files/cpu.c" &&
                    grep -Fq 'p1231-control:' "$W/k/userland/src/eagl.c" &&
                    grep -Fq 'p1231_hash4_sum' "$W/k/userland/src/eagl.c" &&
                    grep -Fq 'p1231-clock-meta:' "$W/k/userland/src/s9_hi_clock_resolve.inc" &&
                    grep -Fq 'p1231_ufs_stats_sysctl' "$W/k/drivers/storage/ufs/hakios.ufs.c" &&
                    grep -Fq 'P1231-ValidateIdle' "$W/k/tools/s9-p122-rootcause-serial.ps1" &&
                    grep -Fq 'GpuLabOffCount' "$W/k/tools/s9-screen-lifecycle-serial.ps1" ||
                      { echo '::error::P12.3.1 paired kernel/SYSTEM/host fixes missing'; exit 1; }
                    echo 'S9 P12.3.1 paired preflight PASS: logical WFI IDs, exact rate table, checksum expiry, Clock visibility, request/apply ACK, UFS evidence'
                    ;;
                esac
                echo 'S9 P12.3 paired preflight PASS: Clock identity, source windows, GL shadow, 30s lower-only floor, mode0 hot restore, CPU3/P9 interlocks'
              fi
              echo "S9 hi=2 preflight: PASS; BOOT+SYSTEM+Windows automation matched at source"
              ;;
          esac
          git clone -q --filter=blob:none https://github.com/Scion-Project/scion-installer.git "$W/pkg"
          git -C "$W/pkg" checkout -q "$PACKAGING_REF"
          # this run's own commit of the device repository, where tools/hakios-device.py sync would put it
          git clone -q --filter=blob:none "https://github.com/$GITHUB_REPOSITORY.git" "$W/k/devices/starlte"
          git -C "$W/k/devices/starlte" checkout -q "$GITHUB_SHA"
          # Only sync optional devices being packaged; S9 itself is checked out above.
          [ -n "$USERDATA_BLOCKS" ] || { echo "::error::userdata_blocks is empty"; exit 1; }
          for pair in $USERDATA_BLOCKS; do
            dev=${pair%%=*}
            case "$dev" in
              starlte) ;;
              star2lte|crownlte) (cd "$W/k" && python3 tools/hakios-device.py sync "$dev") ;;
              *) echo "::error::Unsupported device in userdata_blocks: $dev"; exit 1 ;;
            esac
          done
          # The kernel's Mesa patches are applied in name order by tools/mk-mesa.sh: panfrost-darwin.patch
          # (29 October) changes the meson.build line that turnip-darwin.patch, last by name, still expects,
          # so the build stops at "1 out of 1 hunk FAILED -- saving rejects to file meson.build.rej". This
          # repository carries the corrected two patches until kernel_ref does; --check makes it a no-op then.
          if git -C "$W/k" apply --check "$W/k/devices/starlte/tools/mesa-patch-order.fix" 2>/dev/null; then
            git -C "$W/k" apply "$W/k/devices/starlte/tools/mesa-patch-order.fix"
            echo "Mesa: the turnip/panfrost patch order fixed"
          else
            echo "Mesa: no patch-order fix needed (kernel_ref already has it, or its patches changed)"
          fi
          for r in "$W/k" "$W/k/devices/starlte" "$W/pkg"; do echo "$r: $(git -C "$r" log --oneline -1)"; done
          # The cache keys. They go to GITHUB_OUTPUT, not GITHUB_ENV: a later step's `with:` reads
          # steps.sources.outputs, and the env context is not where a run's own variables live.
          echo "mesa=$(cd "$W/k" && cat tools/mk-mesa.sh tools/mesa/*.patch tools/mesa/hakios-drm/* | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "deps=$(sha256sum "$W/k/xnu-deps/setup.sh" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # the same sources each Metal library is built of (tools/mk-panvk.sh's built-from, and the
          # built-from-tree userland/build.sh compares): a cache of the output is valid only with them
          echo "panvk=$(cd "$W/k" && cat tools/mk-panvk.sh tools/vk/vk_smoke.c tools/mesa/*.patch tools/mesa/panvk/*.patch tools/mesa/hakios-drm/* | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "m2v=$(cd "$W/k/userland" && cat ../tools/metal/mk-metal2vulkan.sh ../tools/metal/bridge/* ../tools/metal/*.metal ../tools/metal/m2v_test.c ../tools/metal/m2v/*.patch 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the theos toolchain and SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /mnt/w/theos
          key: theos-iOSToolchain-x86_64-iPhoneOS16.5-v1

      - name: theos (toolchain and iPhoneOS16.5.sdk)
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          mkdir -p "$W/tc" && curl -L --fail --retry 3 -s "$TOOLCHAIN_URL" | tar -xJ -C "$W/tc"
          LD=$(find "$W/tc" -path '*/bin/ld' \( -type f -o -type l \) | head -1)
          test -n "$LD" || { find "$W/tc" -maxdepth 4 | head -50; exit 1; }
          rm -rf "$THEOS/toolchain/linux/iphone" && mv "$(dirname "$(dirname "$LD")")" "$THEOS/toolchain/linux/iphone"
          rm -rf "$W/tc"
          git init -q "$W/sdks" && git -C "$W/sdks" remote add origin "$SDKS_REPO"
          git -C "$W/sdks" sparse-checkout set iPhoneOS16.5.sdk
          git -C "$W/sdks" fetch -q --depth 1 --filter=blob:none origin HEAD && git -C "$W/sdks" checkout -q FETCH_HEAD
          mv "$W/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/" && rm -rf "$W/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: Cache xnu-deps' sources
        uses: actions/cache@v4
        with:
          path: |
            /mnt/w/k/xnu-deps/AvailabilityVersions
            /mnt/w/k/xnu-deps/libdispatch
            /mnt/w/k/xnu-deps/libpthread
            /mnt/w/k/xnu-deps/mm_bootstrap_cmds
            /mnt/w/k/xnu-deps/tcsh
            /mnt/w/k/xnu-deps/unifdef
            /mnt/w/k/xnu-deps/MacOSX13.3.sdk
          key: xnu-deps-src-${{ steps.sources.outputs.deps }}

      - name: Cache Mesa (built for iOS; keyed on its patches, which is what userland/build.sh checks)
        uses: actions/cache@v4
        with:
          path: /mnt/w/k/xnu-deps/build/mesa/out
          key: mesa-ios-${{ steps.sources.outputs.mesa }}

      - name: The S9's configuration, the kernel tree, the dependencies
        working-directory: /mnt/w/k
        run: |
          make starlte_defconfig
          xnu/apply.sh
          xnu-deps/setup.sh || { for f in xnu-deps/*.log; do echo "== $f"; tail -60 "$f"; done; exit 1; }

      - name: Cache PanVK (Mesa's Vulkan driver for the S9's Mali-G72, built for iOS)
        if: inputs.metal
        uses: actions/cache@v4
        with:
          path: /mnt/w/k/xnu-deps/build/panvk/out
          key: panvk-ios-${{ steps.sources.outputs.panvk }}

      - name: Cache metal2vulkan (the Metal API on Vulkan, built for iOS)
        if: inputs.metal
        uses: actions/cache@v4
        with:
          path: /mnt/w/k/xnu-deps/build/metal2vulkan/out
          key: metal2vulkan-ios-${{ steps.sources.outputs.m2v }}

      - name: The S9's Metal on Vulkan (PanVK and metal2vulkan; metal=true)
        if: inputs.metal
        working-directory: /mnt/w/k
        run: |
          # The same two libraries the S9+ runs: Mesa 25.0.7's PanVK over HakiosMali (tools/mk-panvk.sh),
          # and metal2vulkan's Metal runtime (tools/metal/mk-metal2vulkan.sh ios). Both are off for an
          # ordinary GLES image; userland/build.sh installs them only when METAL=vk and the directories
          # are named. Their caches are keyed on the sources above, so a repeat run starts from the output.
          P=xnu-deps/build/panvk/out
          V=xnu-deps/build/metal2vulkan/out/ios
          if [ ! -f "$P/libvulkan_panfrost.dylib" ] || [ ! -x "$P/vk_smoke" ]; then
            echo "PanVK: Mesa 25.0.7's Vulkan driver for the Mali-G72 (tools/mk-panvk.sh)"
            tools/mk-panvk.sh > "$W/panvk.log" 2>&1 || {
              echo "::error::PanVK did not build"
              grep -a -n -B3 -A15 -E "(: error:|error:|FAILED|ninja: build stopped)" "$W/panvk.log" | tail -120 || true
              echo "== the last 80 lines of $W/panvk.log"
              tail -80 "$W/panvk.log"
              exit 1
            }
            tail -3 "$W/panvk.log"
          else
            echo "PanVK: the cache's $P/libvulkan_panfrost.dylib"
          fi
          want=$(cd userland && cat ../tools/metal/mk-metal2vulkan.sh ../tools/metal/bridge/* ../tools/metal/*.metal \
            ../tools/metal/m2v_test.c ../tools/metal/m2v/*.patch 2>/dev/null | sha256sum)
          if [ ! -f "$V/libmetal2vulkan.dylib" ] || [ "$(cat "$V/built-from-tree" 2>/dev/null)" != "$want" ]; then
            echo "metal2vulkan: the Metal API on Vulkan (tools/metal/mk-metal2vulkan.sh ios; Rust, some minutes)"
            tools/metal/mk-metal2vulkan.sh ios > "$W/metal2vulkan.log" 2>&1 || {
              echo "::error::metal2vulkan did not build"
              grep -a -n -B3 -A15 -E "(: error:|error\[|error:|panicked|FAILED)" "$W/metal2vulkan.log" | tail -120 || true
              echo "== the last 80 lines of $W/metal2vulkan.log"
              tail -80 "$W/metal2vulkan.log"
              exit 1
            }
            tail -3 "$W/metal2vulkan.log"
          else
            echo "metal2vulkan: the cache's $V/libmetal2vulkan.dylib"
          fi
          test -f "$P/libvulkan_panfrost.dylib" && test -x "$P/vk_smoke"
          test -f "$V/libmetal2vulkan.dylib"
          ls -la "$P/libvulkan_panfrost.dylib" "$P/vk_smoke" "$V/libmetal2vulkan.dylib"

      - name: iOS 16.5 (20F66) for iPhone10,3, from Apple
        run: |
          curl -s --fail --retry 3 "https://api.ipsw.me/v4/ipsw/$IPSW_DEVICE/$IPSW_BUILD" > "$W/ipsw.json"
          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$W/ipsw.json")
          SHA1=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("sha1sum",""))' "$W/ipsw.json")
          echo "IPSW: $URL"
          curl -L --fail --retry 5 -s -o "$W/ios.ipsw" "$URL"
          size=$(stat -c %s "$W/ios.ipsw")
          [ "$size" = "$IPSW_SIZE" ] || { echo "::error::the IPSW is $size bytes, not $IPSW_SIZE"; exit 1; }
          if [ -n "$SHA1" ]; then
            got=$(sha1sum "$W/ios.ipsw" | cut -d' ' -f1)
            [ "$got" = "$SHA1" ] || { echo "::error::the IPSW's sha1 is $got, not $SHA1"; exit 1; }
          fi
          echo "IPSW checked: $size bytes${SHA1:+, sha1 $SHA1}"

      - name: Unpack the IPSW (sysimage/unpack.sh), then the iPhone identity (xnuloader/mkidentity.sh)
        working-directory: /mnt/w/k
        run: |
          sysimage/unpack.sh "$W/ios.ipsw"
          xnuloader/mkidentity.sh
          rm -f "$W/ios.ipsw"
          df -h /mnt

      - name: Kernels for the requested devices (S9 by default)
        working-directory: /mnt/w/k
        env:
          USERDATA_BLOCKS: ${{ inputs.userdata_blocks }}
        run: |
          # Wi-Fi is an object of its own, compiled against the kernel's tree: without it the kernel links and says nothing
          tools/mk-brcmfmac.sh > "$W/brcmfmac.log" 2>&1 || { tail -80 "$W/brcmfmac.log"; exit 1; }
          mkdir -p "$W/kernels"
          for pair in $USERDATA_BLOCKS; do
            d=${pair%%=*}
            make ${d}_defconfig > /dev/null
            rm -f hakios-kernel
            make kernel JOBS="$(nproc)" > "$W/kernel-$d.log" 2>&1 || {
              # -j keeps compiling after one file fails, so the diagnostic can be hundreds of lines above the end: say it
              # here, where the step's annotation can be read, as well as the end of the log for the make summary.
              echo "::error::the $d kernel did not build"
              grep -a -n -B3 -A15 -E "(: error:|fatal error:)" "$W/kernel-$d.log" | tail -160 || true
              echo "== the last 60 lines of $W/kernel-$d.log"
              tail -60 "$W/kernel-$d.log"
              exit 1
            }
            cp hakios-kernel "$W/kernels/kernel-$d"
            grep -a 'drivers built in' "$W/kernel-$d.log" | tail -1 || true
          done
          [ -f "$W/kernels/kernel-starlte" ] || { echo "::error::userdata_blocks must include starlte=BLOCKS for this S9 workflow"; exit 1; }
          grep -aq 'lx: brcmfmac 2:' "$W/kernels/kernel-starlte" || { echo "::error::the S9's kernel has no Wi-Fi driver in it"; exit 1; }
          # the S9's configuration last, for mkimage.sh's defaults
          make starlte_defconfig > /dev/null

      - name: The loader (with the identity)
        working-directory: /mnt/w/k
        run: make loader

      - name: The small root and the system image (userland/build.sh; Mesa when the cache did not have it)
        working-directory: /mnt/w/k
        env:
          TWEAKS: ${{ inputs.tweaks }}
          # vmd=0 removes com.apple.voicemail.vmd from the small root (mkjobs.py). It is read here,
          # when the image is built, not at run time; the same token is also passed on as a boot arg.
          VMD: ${{ contains(inputs.boot_args, 'vmd=0') && '0' || '' }}
          # metal=true: build.sh's METAL=vk puts HakiosMetalVK and the two libraries in the small root; the
          # boot line's metal=2 (added below) is what shows apps the device. The window server stays GLES
          # (camtl=0): on iOS 16.5 it has no Metal compositor, and build 65's was slower (docs/metal.md).
          METAL: ${{ inputs.metal && 'vk' || '' }}
          M2V_DIR: ${{ inputs.metal && '/mnt/w/k/xnu-deps/build/metal2vulkan/out/ios' || '' }}
          PANVK_DIR: ${{ inputs.metal && '/mnt/w/k/xnu-deps/build/panvk/out' || '' }}
          METAL_ICD: ${{ inputs.metal && '/redwood/lib/libvulkan_panfrost.dylib' || '' }}
        run: |
          # Sileo and the Procursus bootstrap, pinned by tools/mk-jb.sh. Unlike scion-installer's
          # build-installer.sh (PREINSTALL= ELLEKIT=), this image carries tweak injection: ElleKit
          # provides mobilesubstrate and loads the tweaks; PreferenceLoader draws their settings panes.
          # unzip, ldid and libplist3 are what tools/ipainstaller uses. tweaks=false keeps ipainstaller,
          # drops ElleKit and PreferenceLoader.
          if [ "$TWEAKS" = "true" ]; then
            export ELLEKIT=0.4.5
            export PREINSTALL="debianutils launchctl preferenceloader unzip ldid libplist3"
          else
            export ELLEKIT=
            export PREINSTALL="debianutils launchctl unzip ldid libplist3"
          fi
          tools/mk-jb.sh > "$W/mk-jb.log" 2>&1 || { tail -60 "$W/mk-jb.log"; exit 1; }
          # SafariViewService's container-required names MobileSafari's data container.  A first
          # boot's LaunchServices record can be made before that container exists and keep
          # /var/mobile, which leaves Google's native sign-in sheet unable to start the view
          # service.  prep.sh is run by jb_seed at every boot; the snippet repairs the record with
          # uicache -p (the same call that fixes it by hand) and resprings once, on the first boot.
          test -s devices/starlte/tools/prep-safari-container.sh
          grep -q 'hakios: safari container repair' jb/root/var/jb/prep.sh ||
            sed -i '1r devices/starlte/tools/prep-safari-container.sh' jb/root/var/jb/prep.sh
          grep -q 'hakios: safari container repair' jb/root/var/jb/prep.sh
          sh -n jb/root/var/jb/prep.sh
          sh -n devices/starlte/tools/ipainstaller
          install -m 0755 devices/starlte/tools/ipainstaller jb/root/var/jb/usr/bin/ipainstaller
          test -x jb/root/var/jb/usr/bin/ipainstaller
          test -x jb/root/var/jb/usr/bin/unzip
          test -x jb/root/var/jb/usr/bin/ldid
          if [ "$TWEAKS" = "true" ]; then
            test -d jb/root/var/jb/usr/lib/TweakInject || { echo "::error::ElleKit did not install (no usr/lib/TweakInject): does the kernel ref's tools/mk-jb.sh support ELLEKIT?"; exit 1; }
            # ElleKit ships TweakLoader.dylib as an absolute link to /var/jb/usr/lib/ellekit/
            # libinjector.dylib: on the runner /var/jb does not exist, so test -f must not follow
            # it there. Follow it by hand into the tree that becomes /jb; a regular file is taken
            # as it is.
            loader=jb/root/var/jb/usr/lib/TweakLoader.dylib
            if [ -L "$loader" ]; then
              target=$(readlink "$loader")
              case $target in
                /var/jb/*) target=jb/root$target ;;
                /*) target=jb/root/var/jb$target ;;
                *) target=jb/root/var/jb/usr/lib/$target ;;
              esac
            else
              target=$loader
            fi
            test -f "$target" || { echo "::error::ElleKit is not in the prefix (TweakLoader.dylib -> $target is missing)"; exit 1; }
            test -f jb/root/var/jb/usr/lib/ellekit/libinjector.dylib
          fi
          (source ./xnu-env.sh && cd userland && GL=1 NO_AIR=1 REST=1 ALONE=1 RC=rc.launchd BT=1 DEVICE=starlte JB_KEPT_ONLY=1 bash build.sh) > "$W/userland.log" 2>&1 ||
            { tail -100 "$W/userland.log"; find xnu-deps/build -name '*.rej' -print -exec cat {} \; 2>/dev/null; exit 1; }
          tail -5 "$W/userland.log"
          ls -la userland/root.apfs userland/system.apfs

      - name: S9 installer (only requested device kernels), USERDATA formatted
        env:
          PARTITION: ${{ inputs.partition }}
          BOOT_ARGS: ${{ inputs.boot_args }}
          TIME_LIMIT: ${{ inputs.time_limit }}
          USERDATA_BLOCKS: ${{ inputs.userdata_blocks }}
          # The image's own defaults (configs/starlte.config) boot apps on Metal (metal=2) and leave the window
          # server on GLES (camtl=0); the line repeats them so the boot log says what ran. metal=false builds no
          # Metal stack, so it says metal=0 instead; a metal= or camtl= in boot_args wins either way. fps=true, or
          # any Metal run, adds fps_log=1: the kernel then writes the fps: lines tools/fps.py reads.
          METAL_ARGS: ${{ inputs.metal && 'metal=2 camtl=0' || 'metal=0' }}
          FPS_ARGS: ${{ (inputs.fps || inputs.metal) && 'fps_log=1' || '' }}
        run: |
          [ -n "$USERDATA_BLOCKS" ] || { echo "::error::userdata_blocks is empty: this workflow always makes /private/var persistent on USERDATA"; exit 1; }
          ARGS="$BOOT_ARGS"
          for arg in $FPS_ARGS $METAL_ARGS; do
            name=${arg%%=*}
            case " $ARGS " in *" $name="*) ;; *) ARGS="$arg $ARGS" ;; esac
          done
          # The Exynos loader passes only 607 useful cmdline bytes. A measured S9 boot
          # spent 300 bytes before the -a extras and previously silently cut an
          # argument at byte 607 (max77705_fg_). Reserve another 27 bytes for
          # changing loader/kernel defaults; FAIL instead of building a bad image.
          # This counts the exact per-device -a payload, after the metal/fps
          # automatic arguments have been inserted.
          S9_EXTRA="shub=6 bt=7 $ARGS"
          S9_EXTRA_BYTES=$(printf '%s' "$S9_EXTRA" | LC_ALL=C wc -c | tr -d '[:space:]')
          S9_MAX_EXTRA=280
          echo "S9 bootargs: extra=$S9_EXTRA_BYTES/$S9_MAX_EXTRA bytes; loader effective cmdline cap=607"
          if [ "$S9_EXTRA_BYTES" -gt "$S9_MAX_EXTRA" ]; then
            echo "::error::S9 boot arguments would risk silent truncation: $S9_EXTRA_BYTES extra bytes > $S9_MAX_EXTRA safe bytes. Shorten boot_args; optional P6 diagnostics are runtime sysctls."
            exit 1
          fi
          UARGS=()
          KARGS=()
          for pair in $USERDATA_BLOCKS; do
            case "$pair" in
              starlte=*|star2lte=*|crownlte=*) ;;
              *) echo "::error::userdata_blocks: $pair is not DEVICE=BLOCKS (starlte, star2lte, crownlte)"; exit 1 ;;
            esac
            case "${pair#*=}" in *[!0-9]*|'') echo "::error::userdata_blocks: ${pair#*=} is not a number of 4096-byte blocks"; exit 1 ;; esac
            d=${pair%%=*}
            [ -f "$W/kernels/kernel-$d" ] || { echo "::error::missing kernel for $d"; exit 1; }
            UARGS+=(-u "$pair")
            KARGS+=(-k "$d=$W/kernels/kernel-$d")
          done
          mkdir -p "$W/out"
          SCION_KERNEL="$W/k" "$W/pkg/universal/mkinstaller.sh" -K "$W/k" -s "$W/k/userland/system.apfs" \
            "${KARGS[@]}" \
            -r "$W/k/userland/root.apfs" -p "$PARTITION" -t "$TIME_LIMIT" -U "${UARGS[@]}" \
            -a "starlte=$S9_EXTRA" -o "$W/out/scion-exynos9810-installer-format-userdata.zip"

      - name: Encrypt it (the installer inside, untouched), and check the archive
        env:
          PASS: ${{ secrets.INSTALLER_PASSPHRASE }}
          PARTITION: ${{ inputs.partition }}
          TIME_LIMIT: ${{ inputs.time_limit }}
        run: |
          P="$W/pack" && mkdir -p "$P"
          mv "$W/out/scion-exynos9810-installer-format-userdata.zip" "$P/"
          (cd "$P" && sha256sum scion-exynos9810-installer-format-userdata.zip > SHA256SUMS)
          cat > "$P/README.txt" <<EOF
          Scion for the Galaxy S9 (SM-G960F), built $(date -u +%Y-%m-%d) by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          kernel repo $(git -C "$W/k" rev-parse --short HEAD), device repo ${GITHUB_SHA::7}, system image to $PARTITION

          THIS INSTALLER FORMATS USERDATA AS HFS PLUS: IT ERASES ANDROID'S DATA IN USERDATA
          (apps, photos, accounts). It is what makes /private/var persistent, so that the jailbreak
          prefix (/var/jb: Sileo, ElleKit, PreferenceLoader, ipainstaller) lasts across boots.

          1. Check the zip: sha256sum -c SHA256SUMS   (or compare with: shasum -a 256 scion-exynos9810-installer-format-userdata.zip)
          2. In TWRP, back up Boot, $PARTITION, EFS and USERDATA first and copy the backup off the phone.
          3. Get the zip onto the phone. It is over 2 GiB and reads itself while it formats USERDATA, so it
             cannot be flashed from internal storage (/sdcard): formatting Data unmounts it. Use a microSD
             card or a USB OTG drive, or put the zip in TWRP's RAM:
               adb shell mount -o remount,size=3G /tmp
               adb push scion-exynos9810-installer-format-userdata.zip /tmp/
               adb shell twrp install /tmp/scion-exynos9810-installer-format-userdata.zip
             (adb sideload does not work: TWRP's sideload host keeps the size in 32 bits.)
          4. Flash scion-exynos9810-installer-format-userdata.zip (Install > the zip > swipe, or the twrp install
             command above). Do not unpack it, and keep "format-userdata" in its file name;
             TWRP's update-binary refuses the zip without it.
          5. Reboot > System. To leave Scion: five fingers held on the screen for 1.5 s (back to TWRP), or Vol Down + Power.
          $([ "$TIME_LIMIT" = 0 ] || echo "   A test run: after $TIME_LIMIT s it restarts into TWRP by itself. Pull the log then (/sys/fs/pstore/pmsg-ramoops-0).")
          Android back: restore the Boot, $PARTITION and USERDATA backups in TWRP.

          After the first boot Sileo appears on the home screen (the prefix is copied to /var/jb about
          30 s after SpringBoard). The IPA installer is /var/jb/usr/bin/ipainstaller; docs/IPA.md says how.
          From a terminal (Sileo > Havoc > NewTerm 3): sudo /var/jb/usr/bin/ipainstaller FILE.ipa
          (mobile's default password is "alpine"; change it with passwd).
          EOF
          A="$W/upload/scion-exynos9810-installer-format-userdata.7z" && mkdir -p "$W/upload"
          (cd "$P" && 7z a -t7z -mx=0 -mhe=on -p"$PASS" "$A" scion-exynos9810-installer-format-userdata.zip SHA256SUMS README.txt > /dev/null)
          # the archive opens with the passphrase, and the zip inside is the one made above
          7z t -p"$PASS" "$A" > /dev/null
          want=$(cut -d' ' -f1 "$P/SHA256SUMS")
          got=$(7z x -so -p"$PASS" "$A" scion-exynos9810-installer-format-userdata.zip | sha256sum | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "::error::the zip inside the archive is not the installer"; exit 1; }
          rm -rf "$P"
          ls -la "$A"
          echo "installer sha256 $want (inside the encrypted archive)"

      - uses: actions/upload-artifact@v4
        with:
          name: scion-exynos9810-installer-format-userdata
          path: /mnt/w/upload/scion-exynos9810-installer-format-userdata.7z
          compression-level: 0
          retention-days: 3

      - name: Build logs (no Apple files in them)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s9-installer-logs
          path: |
            /mnt/w/kernel.log
            /mnt/w/userland.log
            /mnt/w/panvk.log
            /mnt/w/metal2vulkan.log
            /mnt/w/k/xnu-deps/*.log
            /mnt/w/k/xnu-deps/build/panvk/*.log
          retention-days: 7
          if-no-files-found: ignore
