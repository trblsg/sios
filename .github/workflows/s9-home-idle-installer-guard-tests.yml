name: S9 Home Idle Installer Preflight (No Image Build)
on:
  push:
    branches: [fix/s9-homeidle-bootarg-guard, fix/s9-p7-clock-basepower-installer, fix/s9-p8-unified-installer, fix/s9-p9-screenoff-installer, fix/s9-p10-lockscreen-installer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hi2-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract the EXACT installer source preflight, validate Bash and byte budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          w=Path('.github/workflows/s9-installer.yml').read_text()
          start=w.index('          # P10 MUST run with hi=2')
          end=w.index('          git clone -q --filter=blob:none https://github.com/Scion-Project/scion-installer.git', start)
          script='set -e\n'+dedent(w[start:end])+'\n'
          Path('/tmp/hi2-preflight.sh').write_text(script)
          assert 'hi_cmd, CTLFLAG_RW | CTLFLAG_LOCKED | CTLFLAG_ANYBODY | CTLFLAG_KERN' in script
          assert 'hi_auto_tick();' in script and 'BOOT+SYSTEM+Windows automation matched' in script
          step=w.split('      - name: Sources (the kernel repository',1)[1]
          step=step.split('        run: |',1)[1].split('      - name:',1)[0]
          Path('/tmp/hi2-sources.sh').write_text(dedent(step))
          boot='hi=2 sleep_cores=1 mali_gov=1 mali_gov_frame=450 mali_probe=1 p3power=1 poster_probe=1 max77705_fg_s=10 max77705_diag=1 max77705_diag_s=30 glstage=1 glcost=1 p0hash=1 p0verify=1'
          extra='shub=6 bt=7 fps_log=1 metal=2 camtl=0 '+boot
          assert len(boot.encode())==177
          assert len(extra.encode())==215
          assert len(extra.encode())<=280
          print('S9 P7: input 177 bytes; -a extra 215 bytes <= conservative 280-byte cap')
          PY
          bash -n /tmp/hi2-preflight.sh
          bash -n /tmp/hi2-sources.sh
      - name: Run real paired kernel-ref preflight and reject broken ref
        run: |
          mkdir -p /tmp/hi2-good /tmp/hi2-bad
          git clone --depth=1 --branch s9/p7-clock-basepower-oneboot --filter=blob:none \
            https://github.com/trblsg/s-kernel.git /tmp/hi2-good/k
          export W=/tmp/hi2-good
          export KERNEL_REF=s9/p7-clock-basepower-oneboot
          export BOOT_ARGS="hi=2 sleep_cores=1 mali_gov=1 mali_gov_frame=450 mali_probe=1 p3power=1 poster_probe=1 max77705_fg_s=10 max77705_diag=1 max77705_diag_s=30 glstage=1 glcost=1 p0hash=1 p0verify=1"
          bash /tmp/hi2-preflight.sh | tee /tmp/hi2-result.txt
          grep -Fq 'S9 hi=2 preflight: PASS; BOOT+SYSTEM+Windows automation matched at source' /tmp/hi2-result.txt
          # Wrong/missing kernel tree must FAIL before expensive compilation.
          if W=/tmp/hi2-bad bash /tmp/hi2-preflight.sh; then
            echo "::error::hi=2 installer preflight accepted a missing kernel tree"
            exit 1
          fi
          echo 'S9 hi2: matching sources PASS, missing/wrong sources FAIL as intended'
      - name: Validate paired P8 kernel and reject a missing safety interlock
        run: |
          git clone --depth=1 --branch s9/p8-unified-power-m3-lab --filter=blob:none \
            https://github.com/trblsg/s-kernel.git /tmp/hi2-p8/k
          export W=/tmp/hi2-p8
          export KERNEL_REF=s9/p8-unified-power-m3-lab
          export BOOT_ARGS="hi=2 mali_gov=1 mali_gov_frame=450 mali_probe=1 p3power=1 poster_probe=1 max77705_fg_s=10 max77705_diag=1 max77705_diag_s=30 glstage=1 glcost=1 p0hash=1 p0verify=1"
          bash /tmp/hi2-preflight.sh | tee /tmp/hi2-p8-result.txt
          grep -Fq 'S9 P8 preflight: PASS; CPU_OFF refused' /tmp/hi2-p8-result.txt
          mkdir -p /tmp/hi2-p8-bad
          cp -a /tmp/hi2-p8/k /tmp/hi2-p8-bad/k
          rm /tmp/hi2-p8-bad/k/drivers/power/exynos/hakios.p8_unified_lab.h
          if W=/tmp/hi2-p8-bad bash /tmp/hi2-preflight.sh; then
            echo "::error::P8 installer accepted missing safe P8 header"
            exit 1
          fi
          echo 'P8 matching kernel and host preflight PASS, missing safety header rejected'
      - name: Verify paired P9 source fixes and reject missing panel boot arg / safety source
        run: |
          git clone --depth=1 --branch s9/p9-screenoff-power-render --filter=blob:none \
            https://github.com/trblsg/s-kernel.git /tmp/hi2-p9/k
          export W=/tmp/hi2-p9
          export KERNEL_REF=s9/p9-screenoff-power-render
          export BOOT_ARGS="hi=2 panel=1 mali_gov=1 mali_gov_frame=450 mali_probe=1 p3power=1 poster_probe=1 max77705_fg_s=10 max77705_diag=1 max77705_diag_s=30 glstage=1 glcost=1 p0hash=1 p0verify=1"
          bash /tmp/hi2-preflight.sh | tee /tmp/hi2-p9-result.txt
          grep -Fq 'S9 P9 preflight PASS: GPU physical OFF/ON' /tmp/hi2-p9-result.txt
          if BOOT_ARGS="hi=2 mali_gov=1" bash /tmp/hi2-preflight.sh; then
            echo "::error::P9 accepted build with missing panel=1"; exit 1
          fi
          mkdir -p /tmp/hi2-p9-bad
          cp -a /tmp/hi2-p9/k /tmp/hi2-p9-bad/k
          rm /tmp/hi2-p9-bad/k/drivers/gpu/mali/hakios.mali_lab.h
          if W=/tmp/hi2-p9-bad bash /tmp/hi2-preflight.sh; then
            echo "::error::P9 accepted build with missing GPU safe gate source"; exit 1
          fi
          echo 'P9 matched source and P7 EPERM preflight PASS; bad panel args / missing driver source rejected'
      - name: Verify one matched P10 Lock Screen kernel/userland and reject absent lock proof
        run: |
          git clone --depth=1 --branch s9/p10-lockscreen-source-guard --filter=blob:none \
            https://github.com/trblsg/s-kernel.git /tmp/hi2-p10/k
          export W=/tmp/hi2-p10
          export KERNEL_REF=s9/p10-lockscreen-source-guard
          export BOOT_ARGS="hi=2 panel=1 mali_gov=1 mali_gov_frame=450 mali_probe=1 p3power=1 poster_probe=1 max77705_fg_s=10 max77705_diag=1 max77705_diag_s=30 glstage=1 glcost=1 p0hash=1 p0verify=1"
          bash /tmp/hi2-preflight.sh | tee /tmp/hi2-p10-result.txt
          grep -Fq 'S9 P10 preflight PASS: exact lockscreen timers' /tmp/hi2-p10-result.txt
          if BOOT_ARGS="hi=0 panel=1 mali_gov=1" bash /tmp/hi2-preflight.sh; then
            echo "::error::P10 accepted missing hi=2 SpringBoard source hook"; exit 1
          fi
          mkdir -p /tmp/hi2-p10-bad
          cp -a /tmp/hi2-p10/k /tmp/hi2-p10-bad/k
          rm /tmp/hi2-p10-bad/k/userland/src/s9_p10_lock_scene.inc
          if W=/tmp/hi2-p10-bad bash /tmp/hi2-preflight.sh; then
            echo "::error::P10 accepted missing SBLockScreenManager and cover sheet proof"; exit 1
          fi
          echo 'P10 paired source and P9.1 safe DCS gate PASS; hi=2/missing lock proof rejected'
