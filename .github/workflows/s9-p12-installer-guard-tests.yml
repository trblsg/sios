name: S9 P12 paired thermal/idle installer guards
on:
  push:
    branches: [fix/s9-p12-thermal-idle-installer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pair kernel and SYSTEM to one P12 commit before heavy installation
        run: |
          git clone --depth=1 --branch s9/p12-thermal-deep-idle --filter=blob:none https://github.com/trblsg/s-kernel.git /tmp/s9-p12-source
          test -s /tmp/s9-p12-source/drivers/power/exynos/hakios.p12_thermal.h
          test -s /tmp/s9-p12-source/userland/src/inject.c
          test -s /tmp/s9-p12-source/tools/s9-p12-dual-serial.ps1
          test -s /tmp/s9-p12-source/tools/s9-p122-rootcause-serial.ps1
          test -s /tmp/s9-p12-source/drivers/gpu/mali/hakios.p122_diag.h
          test -s /tmp/s9-p12-source/userland/src/s9_p122_frame_diag.h
          grep -Fq 'p12_gpu_boot_auto' /tmp/s9-p12-source/drivers/gpu/mali/hakios.mali.c
          grep -Fq 'p12_gpu_boot_enable' /tmp/s9-p12-source/drivers/gpu/mali/hakios.mali_lab.h
          grep -Fq 'p12-ca: forwarded=' /tmp/s9-p12-source/userland/src/inject.c
          grep -Fq 'p12_cpu_mode_sysctl' /tmp/s9-p12-source/drivers/power/exynos/hakios.exynos_cpufreq.c
          grep -Fq 'p12_wfi_stats_sysctl' /tmp/s9-p12-source/drivers/power/exynos/hakios.exynos_cpufreq.c
          grep -Fq 'p12_idle_diag_sysctl' /tmp/s9-p12-source/drivers/power/exynos/hakios.exynos_cpufreq.c
          grep -Fq 'hakios_p12_idle_enter' /tmp/s9-p12-source/xnu/files/cpu.c
          grep -Fq 'P12-CoolStart 12' /tmp/s9-p12-source/tools/s9-p12-dual-serial.ps1
          grep -Fq 'P12-QuiesceHI2' /tmp/s9-p12-source/tools/s9-p12-dual-serial.ps1
          grep -Fq 'P12HiGateStopSeen' /tmp/s9-p12-source/tools/s9-p12-dual-serial.ps1
          grep -Fq 'p122_diag_mode_sysctl' /tmp/s9-p12-source/drivers/gpu/mali/hakios.mali.c
          grep -Fq 'p122_gpu_stats_sysctl' /tmp/s9-p12-source/drivers/gpu/mali/hakios.mali.c
          grep -Fq 'p122-gl: mode=%d ack=kernel_sysctl' /tmp/s9-p12-source/userland/src/eagl.c
          grep -Fq 'P122-Profile 2' /tmp/s9-p12-source/tools/s9-p122-rootcause-serial.ps1
          cc -std=c11 -O2 -Wall -Wextra -Werror /tmp/s9-p12-source/tools/tests/test_s9_p122_rootcause.c -o /tmp/test-s9-p122
          /tmp/test-s9-p122
          cc -std=c11 -O2 -Wall -Wextra -Werror /tmp/s9-p12-source/tools/tests/test_s9_p12_thermal_policy.c -o /tmp/test-s9-p12
          /tmp/test-s9-p12
      - name: Verify installer source guard, boot-args and no unsafe power combination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/s9-installer.yml').read_text()
          for required in ('s9/p12-*', 'docs/s9-p12-thermal-deep-idle.md',
             'p12_gpu_boot_auto=1', 'power/exynos bsd/dev/hakios.p12_thermal.h',
             'p12_cpu_mode_sysctl', 'p12_gpu_boot_enable',
             'p12_gpu_boot_stats_sysctl', 'p12_wfi_stats_sysctl', 'p12_idle_diag_sysctl',
             'hakios_p12_idle_enter', 'hakios_p12_idle_denied',
             'P12-CoolStart 12', 'P12-EarlyThermalGuard', 'P12-QuiesceHI2',
             'p122_diag_mode_sysctl', 'p122_gpu_stats_sysctl', 'p122_job_latency',
             'p122-gl: mode=%d ack=kernel_sysctl', 'p122-gl-window:',
             'P122-Profile 0', 'P122-Profile 1', 'P122-Profile 2',
             'test_s9_p122_rootcause.c', 'docs/s9-p122-rootcause.md',
             'P12.2 requires exactly one p122=1', 'causal baseline forbids',
             'P12HiGateStopSeen', 'if($InteractiveAB)', 'PASSIVE_ON',
             'if(-not $Cleanup){Life-CheckSafety', 'P12.1 MANUAL_WAKE VERIFIED',
             'g3d_lab_stats_sysctl', 'p12-ca: forwarded=', 'test_s9_p12_thermal_policy.c',
             'p8-safety: BIG CPU_OFF REFUSED', 'panel_sleep=1', 'sleep_cores=1',
             'syssleep=1', 'p9_panel_mode=1', 'mali_dvs=1',
             'source pairing or guarded thermal logic missing'):
            assert required in workflow, required
          assert workflow.index('S9 P12 paired BOOT/SYSTEM/host preflight') < workflow.index('git clone -q --filter=blob:none https://github.com/Scion-Project/scion-installer.git')
          assert 'P12 full two-track build requires opt-in' not in workflow
          # Exercise the exact bash preflight block without running the installer:
          # absent/0=warning, 1=enabled, malformed/duplicates=fail closed.
          import os, subprocess
          fragment='p12_gpu_seen=0'+workflow.split('p12_gpu_seen=0',1)[1].split('p122_seen=0',1)[0]
          for arg, success, marker in [
            ('hi=2',True,'NOT enabled'),
            ('hi=2 p12_gpu_boot_auto=0',True,'NOT enabled'),
            ('hi=2 p12_gpu_boot_auto=1',True,'GPU physical OFF'),
            ('hi=2 p12_gpu_boot_auto=2',False,'must be 0 or 1'),
            ('hi=2 p12_gpu_boot_auto=1 p12_gpu_boot_auto=0',False,'duplicated'),
            ('hi=2 p12_gpu_boot_auto=1 p12_gpu_boot_auto=1',False,'duplicated')
          ]:
            p=subprocess.run(['bash','-eu','-c',fragment],env={**os.environ,'BOOT_ARGS':arg},capture_output=True,text=True)
            combined=p.stdout+'\n'+p.stderr
            assert (p.returncode==0)==success and marker in combined, (arg,p.returncode,combined)
          # P12.2 exact bootarg preflight: opt-in required and no old GL profiler contamination.
          p122_fragment='p122_seen=0'+workflow.split('p122_seen=0',1)[1].split('for unsafe in sleep_cores=1',1)[0]
          base='hi=2 mali_gov=1 mali_gov_frame=450 mali_probe=1'
          for arg, success, marker in [
            (base,False,'requires exactly one p122=1'),
            (base+' p122=1',True,''),
            (base+' p122=0',False,'must equal 1'),
            (base+' p122=1 p122=1',False,'exactly one'),
            ('hi=2 p122=1 mali_gov=1 mali_probe=1',False,'mali_gov_frame=450'),
            (base+' p122=1 glcost=1',False,'forbids pre-enabled'),
            (base+' p122=1 p0hash=1',False,'forbids pre-enabled'),
            (base+' p122=1 glprof=1000',False,'heavyweight')
          ]:
            p=subprocess.run(['bash','-eu','-c',p122_fragment],env={**os.environ,'BOOT_ARGS':arg},capture_output=True,text=True)
            combined=p.stdout+'\n'+p.stderr
            assert (p.returncode==0)==success and marker in combined, (arg,p.returncode,combined)
          print('P12.2 opt-in and profiler clean baseline PASS; old GPU boot policy 0/absent warn, 1 arms, invalid/duplicate fail')
          PY
          git diff --check
